server:
  port: ${PORT:8080}
  forward-headers-strategy: framework

spring:
  profiles:
    active: local   # 기본값: 로컬 개발. 배포 시 환경변수 SPRING_PROFILES_ACTIVE=deploy 로 덮어씀
  config:
    import: optional:file:.env[.properties]

  jackson:
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false
    default-property-inclusion: non_null
    time-zone: Asia/Seoul

  jpa:
    hibernate:
      ddl-auto: update
    show-sql : true
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.mariadb.jdbc.Driver
  redis:
    host: ${REDIS_HOST:localhost}
    port: ${REDIS_PORT:6379}
    password: ${REDIS_PASSWORD:}

  thymeleaf:
    cache: false
    prefix: classpath:/templates/
    suffix: .html
  h2:
    console:
      enabled: true

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            redirect-uri: "{baseUrl}/api/login/oauth2/code/{registrationId}"   # ✅ 추가!
            scope:
              - email
              - profile
          github:
            client-id: ${GITHUB_CLIENT_ID:your-github-client-id}
            client-secret: ${GITHUB_CLIENT_SECRET:your-github-client-secret}
            scope:
              - user:email
              - read:user

jwt:
  secret: ${JWT_SECRET_KEY}
  access-token:
    expiration: 7200000 # 2시간
  refresh-token:
    expiration: 604800000 # 7일

domjudge:
  api:
    url: ${DOMJUDGE_URL}
  username: ${DOMJUDGE_ID}
  password: ${DOMJUDGE_PW}

app:
  oauth2:
    authorized-redirect-uris:
      #- http://localhost:3000/auth/callback  # 프론트엔드 콜백 페이지
      - https://hj.walab.info/handongjudge/auth/callback
logging:
  level:
    com.project.handongjudge: DEBUG
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
    org.hibernate.type.descriptor.sql.BasicExtractor: TRACE  # 결과값도 보여줌

